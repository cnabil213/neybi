  const { frigo, limits } = computeAlerts(report, now);
  const alertLines = [];
  if (frigo.length) alertLines.push(`- FRIGO : ${plural(frigo.length, 'échantillon')} au frigo (${frigo.map(x => `${whereOf(x)}, ${x.band.short}`).join(' ; ')})`);
  for (const l of limits.filter(x => x.tone !== 'neutral')) {
    alertLines.push(`- Holding time ${l.tone === 'todo' ? 'DÉPASSÉ' : 'proche'} : ${whereOf(l)} — ${l.label} ${fmtDM(l.due)} (${l.rest})`);
  }
  const compose = (pointsMax, maxAlerts) => {
    const shown = alertLines.slice(0, maxAlerts);
    const more = alertLines.length - shown.length;
    let pts = report.pointsASuivre.trim().replace(/\r?\n/g, '\n');
    if (pts.length > pointsMax) pts = `${pts.slice(0, Math.max(0, pointsMax)).trimEnd()}… (suite dans le PDF)`;
    const lines = [
      'Bonjour à tous,', '',
      `Veuillez trouver ci-joint le rapport de formulation du ${fmtDate(now)}${shift ? ` (shift ${shift})` : ''} — PDF en pièce jointe.`, '',
      ...(alertLines.length ? ['Points de vigilance :', ...shown, ...(more ? [`- … et ${more} autre(s), voir le PDF`] : []), ''] : ['Aucune alerte frigo ni holding time proche.', '']),
      ...(pts ? ['Points à suivre :', pts, ''] : []),
      'Cordialement,',
      author ? `Rédigé par : ${author}` : 'Rédigé par : —',
    ];
    return lines.join('\r\n');
  };
  const to = encAddr(state.settings.mailTo);
  const cc = encAddr(state.settings.mailCc);
  const urlFor = body => `mailto:${to}?${cc ? `cc=${cc}&` : ''}subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  let pointsMax = 700, maxAlerts = 6;
  let body = compose(pointsMax, maxAlerts);
  while ((body.length > 1500 || urlFor(body).length > MAIL_URL_MAX) && (pointsMax > 0 || maxAlerts > 1)) {
    if (pointsMax > 0) pointsMax = Math.max(0, pointsMax - 80);
    else maxAlerts -= 1;
    body = compose(pointsMax, maxAlerts);
  }
  return { subject, body, url: urlFor(body), hasRecipients: !!(state.settings.mailTo || state.settings.mailCc) };
}
function prepareMail() {
  const m = buildMail(state.report, state.author, new Date());
  const a = h('a', { href: m.url });
  a.click();
  if (m.hasRecipients) toast('Pensez à joindre le PDF exporté.', { timeout: 6000 });
  else toast('Pensez à joindre le PDF exporté. Aucun destinataire enregistré.', { action: 'Configurer', onAction: openSettings, tone: 'warn' });
}

/* =========================================================================
   13. Actions : lot terminé, historique, sauvegarde & partage, paramètres
   ========================================================================= */
async function confirmAdvance(l) {
  const r = state.report;
  const cur = r.bands.enCours[l.id], next = r.bands.suivant1[l.id];
  const ok = await confirmDialog({
    title: 'Lot terminé ?',
    confirmLabel: 'Oui, passer au suivant',
    message: [
      h('p', {}, 'Le lot ', h('b', { class: 'mono', text: cur.lot || '(non renseigné)' }), ` (${l.name}) est terminé ?`),
      h('p', {}, 'Le lot suivant ', h('b', { class: 'mono', text: next.lot || '(non renseigné)' }), ' passera en cours et le lot suivant +1 deviendra le lot suivant.'),
      h('p', { class: 'muted', text: 'Les statuts du nouveau lot en cours repartent à N/A (lot, produit et remarques sont repris). Vous pourrez annuler.' }),
    ],
  });
  if (!ok) return;
  change(rep => {
    const s1 = rep.bands.suivant1[l.id], s2 = rep.bands.suivant2[l.id];
    const nc = defaultCard('enCours', l.id);
    nc.lot = s1.lot;
    nc.produit = PRODUCTS[l.id].includes(s1.produit) ? s1.produit : '';
    nc.remarques = s1.remarques;
    rep.bands.enCours[l.id] = nc;
    rep.bands.suivant1[l.id] = clone(s2);
    rep.bands.suivant2[l.id] = defaultCard('suivant', l.id);
  });
  toast(`Lot avancé — ${l.name}`, { action: 'Annuler', onAction: undo });
}
function addSnapshot(at) {
  state.history.unshift({ id: uid(), at: at.toISOString(), shift: state.report.meta.shift, author: state.author, report: clone(state.report) });
  if (state.history.length > HISTORY_MAX) state.history.length = HISTORY_MAX;
  markSharedDirty();
}
const lotsSummary = rep => LINES.map(l => `${l.name} ${rep.bands.enCours[l.id].lot || '—'}`).join(' · ');
function openHistory() {
  const list = h('ol', { class: 'hist' });
  const d = openDialog({
    title: 'Historique des rapports', className: 'dlg--wide',
    body: [h('p', { class: 'muted', text: `Un instantané est archivé à chaque « Exporter en PDF » (${HISTORY_MAX} derniers conservés).` }), list],
    actions: [{ label: 'Fermer', value: false }],
  });
  if (!state.history.length) {
    list.replaceWith(h('div', { class: 'empty', text: 'Aucun rapport archivé pour l’instant.' }));
    return;
  }
  for (const e of state.history) {
    const at = new Date(e.at);
    list.append(h('li', { class: 'hist__item' },
      h('div', { class: 'hist__main' },
        h('div', { class: 'hist__when', text: HIST_DATE.format(at) }),
        h('div', { class: 'hist__meta', text: [e.shift ? `Shift ${e.shift}` : 'Shift —', e.author ? `par ${e.author}` : ''].filter(Boolean).join(' · ') }),
        h('div', { class: 'hist__lots', text: lotsSummary(e.report) })),
      h('div', { class: 'hist__act' },
        h('button', { type: 'button', class: 'btn btn-secondary btn-sm', onclick: () => { d.close(); openPreview(e); } }, icon('eye'), 'Voir / imprimer'),
        h('button', { type: 'button', class: 'btn btn-quiet btn-sm', onclick: async () => {
          d.close();
          const ok = await confirmDialog({ title: 'Restaurer ce rapport ?', confirmLabel: 'Restaurer',
            message: `Le rapport actuel sera remplacé par celui du ${HIST_DATE.format(at)}. Vous pourrez annuler.` });
          if (!ok) return;
          replaceReport(normalizeReport(clone(e.report)));
          toast('Rapport restauré', { action: 'Annuler', onAction: undo });
        } }, icon('reset'), 'Restaurer'))));
  }
}
function exportJson() {
  const data = currentData();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const now = new Date();
  const a = h('a', { href: url, download: `rapport-formulation-sauvegarde-${fmtISODate(now)}-${pad2(now.getHours())}${pad2(now.getMinutes())}.json` });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  toast('Sauvegarde exportée');
}
async function importJsonFile(file) {
  let d;
  try {
    if (file.size > 20e6) throw new Error('size');
    d = normalizeData(JSON.parse(await file.text()));
  } catch {
    await messageDialog('Fichier non reconnu', 'Ce fichier n’est pas une sauvegarde valide du Rapport de formulation. Aucune donnée n’a été modifiée.');
    return;
  }
  const from = [d.savedBy ? `de ${d.savedBy}` : '', d.savedAt ? `du ${fmtDM(new Date(d.savedAt))}` : ''].filter(Boolean).join(' ');
  const ok = await confirmDialog({ title: 'Importer cette sauvegarde ?', confirmLabel: 'Importer',
    message: `Le rapport actuel sera remplacé par la sauvegarde${from ? ` ${from}` : ''}. L’historique est fusionné. Vous pourrez annuler.` });
  if (!ok) return;
  const ids = new Set(state.history.map(e => e.id));
  state.history = [...state.history, ...d.history.filter(e => !ids.has(e.id))].sort((a, b) => b.at.localeCompare(a.at)).slice(0, HISTORY_MAX);
  if (!state.settings.mailTo && !state.settings.mailCc) state.settings = d.settings;
  replaceReport(d.report);
  toast('Sauvegarde importée', { action: 'Annuler', onAction: undo });
}
function openShare() {
  const body = h('div', { class: 'form-grid' });
  let dref = null;
  const render = () => {
    const secLocal = h('section', { class: 'sect' }, h('h3', { text: 'Sur ce poste' }),
      h('p', { text: persist.ok
        ? `Chaque modification est enregistrée automatiquement dans ce navigateur${persist.at ? ` (dernier enregistrement à ${fmtTime(persist.at)})` : ''}. Le rapport est retrouvé à la réouverture.`
        : 'Le stockage local est indisponible dans ce navigateur : utilisez « Exporter une sauvegarde » pour ne rien perdre.' }));
    let secShared;
    if (!shared.supported) {
      secShared = h('section', { class: 'sect' }, h('h3', { text: 'Fichier partagé (Teams / OneDrive)' }),
        h('p', { class: 'muted', text: 'Le fichier partagé nécessite Microsoft Edge ou Google Chrome. Dans ce navigateur, utilisez « Exporter / Importer » ci-dessous pour transmettre le rapport.' }));
    } else {
      const status = !shared.handle ? ['na', 'Non lié'] : shared.perm !== 'granted' ? ['wip', 'Permission à redonner'] : shared.error ? ['todo', shared.error] : ['ok', 'Lié et synchronisé'];
      const acts = !shared.handle
        ? [h('button', { type: 'button', class: 'btn btn-primary btn-sm', onclick: linkNewShared }, icon('plus'), 'Créer le fichier partagé…'),
           h('button', { type: 'button', class: 'btn btn-secondary btn-sm', onclick: linkExistingShared }, icon('link'), 'Lier un fichier existant…')]
        : [shared.perm !== 'granted' ? h('button', { type: 'button', class: 'btn btn-primary btn-sm', onclick: reconnectShared }, icon('link'), 'Reconnecter') : null,
           h('button', { type: 'button', class: 'btn btn-secondary btn-sm', onclick: linkExistingShared }, icon('link'), 'Lier un autre fichier…'),
           h('button', { type: 'button', class: 'btn btn-quiet btn-sm', onclick: unlinkShared }, icon('x'), 'Délier')];
      secShared = h('section', { class: 'sect' }, h('h3', { text: 'Fichier partagé (Teams / OneDrive)' }),
        h('p', { class: 'muted', text: 'Pour que le shift suivant retrouve le rapport sur un autre PC : liez un fichier « rapport-formulation-donnees.json » placé dans le dossier Teams/OneDrive synchronisé de l’équipe. L’outil y écrit ensuite automatiquement.' }),
        h('dl', { class: 'kv' },
          h('dt', { text: 'État' }), h('dd', {}, h('span', { class: `badge tone-${status[0]}`, text: status[1] })),
          shared.handle ? [h('dt', { text: 'Fichier' }), h('dd', { class: 'mono', text: shared.name })] : null,
          shared.handle ? [h('dt', { text: 'Dernière synchro' }), h('dd', { text: shared.lastSync ? fmtDM(shared.lastSync) : '—' })] : null),
        h('div', { class: 'sect__actions' }, acts));
    }
    const secFile = h('section', { class: 'sect' }, h('h3', { text: 'Sauvegarde manuelle (.json)' }),
      h('p', { class: 'muted', text: 'Solution de secours universelle : exportez le rapport dans un fichier, puis importez-le sur un autre poste.' }),
      h('div', { class: 'sect__actions' },
        h('button', { type: 'button', class: 'btn btn-secondary btn-sm', onclick: exportJson }, icon('download'), 'Exporter une sauvegarde'),
        h('button', { type: 'button', class: 'btn btn-secondary btn-sm', onclick: () => { dref?.close(); $('#file-import').click(); } }, icon('upload'), 'Importer une sauvegarde…')));
    body.replaceChildren(secLocal, secShared, secFile);
  };
  render();
  shared.onchange = render;
  dref = openDialog({ title: 'Sauvegarde & partage', className: 'dlg--wide', body, actions: [{ label: 'Fermer', value: false }] });
  dref.result.then(() => { if (shared.onchange === render) shared.onchange = null; });
}
function openSettings() {
  const to = h('input', { class: 'input', id: 'set-to', type: 'text', value: state.settings.mailTo, placeholder: 'ex. formulation@exemple.com', autocomplete: 'off', spellcheck: 'false' });
  const cc = h('input', { class: 'input', id: 'set-cc', type: 'text', value: state.settings.mailCc, placeholder: 'facultatif', autocomplete: 'off', spellcheck: 'false' });
  openDialog({
    title: 'Paramètres',
    body: h('div', { class: 'form-grid' },
      h('p', { class: 'muted', text: 'Destinataires utilisés par « Préparer le mail ». Séparez plusieurs adresses par des points-virgules.' }),
      h('div', { class: 'field' }, h('label', { class: 'field__label', for: 'set-to', text: 'Destinataires (À)' }), to),
      h('div', { class: 'field' }, h('label', { class: 'field__label', for: 'set-cc', text: 'Copie (Cc)' }), cc),
      h('p', { class: 'hint', text: 'Ces paramètres sont enregistrés avec le rapport (et donc partagés avec l’équipe si un fichier partagé est lié).' })),
    actions: [
      { label: 'Annuler', value: false },
      { label: 'Enregistrer', value: true, cls: 'btn-primary', run: () => {
        state.settings = normalizeSettings({ mailTo: to.value, mailCc: cc.value });
        schedulePersist();
        toast('Paramètres enregistrés');
      } },
    ],
    onOpen: () => to.focus(),
  });
}
async function confirmReset() {
  const ok = await confirmDialog({
    title: 'Réinitialiser le rapport ?', confirmLabel: 'Réinitialiser', danger: true,
    message: 'Toutes les cartes, les blocs annexes et les points à suivre seront vidés. L’historique et les paramètres sont conservés. Vous pourrez annuler.',
  });
  if (!ok) return;
  const r = defaultReport();
  r.meta.shift = shiftForHour(new Date().getHours());
  replaceReport(r);
  toast('Rapport réinitialisé', { action: 'Annuler', onAction: undo });
}

/* Menu « ⋯ » (bouton menu accessible) */
function toggleTextSize() {
  prefs.textLarge = !prefs.textLarge;
  savePrefs();
  applyTextSize();
  toast(prefs.textLarge ? 'Texte agrandi' : 'Texte normal');
}
function applyTextSize() {
  document.documentElement.classList.toggle('text-lg', prefs.textLarge);
  $('#btn-aa').setAttribute('aria-pressed', String(prefs.textLarge));
  $('#mi-aa')?.setAttribute('aria-checked', String(prefs.textLarge));
  requestAnimationFrame(() => autogrowIn(document));
}
function buildMenu() {
  const btn = $('#btn-menu'), menu = $('#main-menu');
  const ITEMS = [
    { label: 'Exporter en PDF', icon: 'pdf', run: exportPdf, narrow: true },
    { label: 'Préparer le mail', icon: 'mail', run: prepareMail, narrow: true },
    { id: 'mi-undo', label: 'Annuler la dernière modification', icon: 'undo', run: undo, narrow: true },
    { sep: true, narrow: true },
    { label: 'Aperçu impression', icon: 'eye', run: () => openPreview() },
    { label: 'Historique', icon: 'history', run: openHistory },
    { label: 'Sauvegarde & partage', icon: 'cloud', run: openShare },
    { label: 'Paramètres', icon: 'sliders', run: openSettings },
    { sep: true, narrow: true },
    { id: 'mi-aa', label: 'Texte agrandi', icon: 'text', run: toggleTextSize, narrow: true, check: true },
    { label: 'Étiquettes', icon: 'tag', href: 'etiquettes.html', narrow: true },
    { sep: true },
    { label: 'Réinitialiser le rapport…', icon: 'reset', run: confirmReset, danger: true },
  ];
  for (const it of ITEMS) {
    if (it.sep) { menu.append(h('div', { class: 'menu__sep', role: 'separator', 'data-narrow': it.narrow ? '' : null })); continue; }
    const attrs = { class: `menu__item${it.danger ? ' is-danger' : ''}`, role: it.check ? 'menuitemcheckbox' : 'menuitem', tabindex: '-1', id: it.id, 'data-narrow': it.narrow ? '' : null };
    const el = it.href ? h('a', { ...attrs, href: it.href }, icon(it.icon), it.label) : h('button', { ...attrs, type: 'button' }, icon(it.icon), it.label);
    if (it.check) el.setAttribute('aria-checked', 'false');
    if (it.run) el.addEventListener('click', () => { close(false); it.run(); });
    menu.append(el);
  }
  const visibleItems = () => [...menu.querySelectorAll('.menu__item')].filter(x => x.offsetParent !== null && !x.disabled);
  function open() {
    menu.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    visibleItems()[0]?.focus();
  }
  function close(returnFocus = true) {
    if (menu.hidden) return;
    menu.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
    if (returnFocus) btn.focus();
  }
  btn.addEventListener('click', () => (menu.hidden ? open() : close()));
  menu.addEventListener('keydown', e => {
    const items = visibleItems();
    const i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length]?.focus(); }
    else if (e.key === 'Home') { e.preventDefault(); items[0]?.focus(); }
    else if (e.key === 'End') { e.preventDefault(); items[items.length - 1]?.focus(); }
    else if (e.key === 'Escape') { e.preventDefault(); close(); }
    else if (e.key === 'Tab') close(false);
  });
  document.addEventListener('pointerdown', e => { if (!menu.hidden && !menu.contains(e.target) && !btn.contains(e.target)) close(false); });
}

/* =========================================================================
   14. Démarrage
   ========================================================================= */
function hydrateIcons() {
  document.querySelectorAll('[data-icon]').forEach(sp => sp.replaceWith(icon(sp.dataset.icon)));
}
function loadInitial() {
  persist.ok = probeStorage();
  loadPrefs();
  state.author = (ls.get(KEYS.author) || '').slice(0, 60);
  state.report = defaultReport();
  const raw = ls.get(KEYS.data);
  let problem = false;
  if (raw) {
    try {
      const d = normalizeData(JSON.parse(raw));
      state.report = d.report;
      state.history = d.history;
      state.settings = d.settings;
      if (d.savedAt) { persist.at = new Date(d.savedAt); persist.state = 'saved'; }
    } catch { problem = true; }
  }
  if (!state.report.meta.shift) state.report.meta.shift = shiftForHour(new Date().getHours());
  return problem;
}
function bindGlobal() {
  $('#btn-undo').addEventListener('click', undo);
  $('#btn-mail').addEventListener('click', prepareMail);
  $('#btn-pdf').addEventListener('click', exportPdf);
  $('#btn-aa').addEventListener('click', toggleTextSize);
  $('#btn-reconnect').addEventListener('click', reconnectShared);
  $('#file-import').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) importJsonFile(f);
  });
  const isTextEditing = el => !!el && ((el.tagName === 'INPUT' && /^(text|search|email|tel|url|number)$/.test(el.type)) || el.tagName === 'TEXTAREA' || el.isContentEditable);
  document.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey;
    if (!mod || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 's') { e.preventDefault(); forceSave(); }
    else if (k === 'z' && !e.shiftKey && !isTextEditing(e.target) && !document.querySelector('dialog[open]')) { e.preventDefault(); undo(); }
  });
  window.addEventListener('beforeprint', () => { if (!printingSnapshot) renderPrintRoot(); });
  window.addEventListener('pagehide', () => { if (persist.timer) saveLocalNow(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      if (persist.timer) saveLocalNow();
      if (shared.dirty && shared.perm === 'granted') saveShared();
    } else checkSharedSoon();
  });
  window.addEventListener('focus', checkSharedSoon);
  window.addEventListener('storage', e => {
    // Modification faite dans un autre onglet de ce poste : on la reprend si rien n'est en attente ici.
    if (e.key !== KEYS.data || !e.newValue || persist.timer) return;
    try {
      const d = normalizeData(JSON.parse(e.newValue));
      state.report = d.report; state.history = d.history; state.settings = d.settings;
      persist.at = new Date(); persist.state = 'saved';
      refresh(); schedulePrint(); renderSaveState();
      toast('Rapport mis à jour depuis un autre onglet');
    } catch { /* ignoré */ }
  });
  let rz = 0;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => autogrowIn(document), 150); });
}
function tick() {
  renderMeta();
  renderWatch();
  for (const v of views) v.sync();
  renderSaveState();
  if (!printingSnapshot) schedulePrint();
}
function init() {
  const problem = loadInitial();
  hydrateIcons();
  buildMenu();
  buildMeta();
  buildLineFilter();
  buildBands();
  buildAnnexes();
  applyTextSize();
  $('#banner-storage').hidden = persist.ok;
  bindGlobal();
  refresh();
  renderSaveState();
  renderPrintRoot();
  requestAnimationFrame(() => autogrowIn(document));
  setInterval(tick, 15000);
  initShared();
  if (problem) toast('Les données enregistrées étaient illisibles : rapport vierge.', { tone: 'warn', timeout: 8000 });
}
init();
})();
